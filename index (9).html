/* ---------- 5 ---------- */
P.push({id:"p5",num:5,title:"Linux System Calls in C",aim:"Write and execute a C program using open(), write(), read() and close().",blocks:[
 {t:"code",file:"p5.c",c:String.raw`#include <stdio.h>
#include <fcntl.h>
#include <unistd.h>
 
int main()
{
    int fd, n;
    char text[100];
 
    fd = open("data.txt", O_CREAT | O_WRONLY | O_TRUNC, 0644);
    if (fd == -1)
    {
        perror("open");
        return 1;
    }
 
    write(fd, "Hello Linux\n", 12);
    close(fd);
 
    fd = open("data.txt", O_RDONLY);
    if (fd == -1)
    {
        perror("open");
        return 1;
    }
 
    n = read(fd, text, 99);
    if (n == -1)
    {
        perror("read");
        close(fd);
        return 1;
    }
 
    text[n] = '\0';
    printf("%s", text);
    close(fd);
 
    return 0;
}`},
 {t:"cmd",label:"Compile & run",c:String.raw`gcc p5.c -o p5
./p5`},
 {t:"out",label:"Output",c:String.raw`Hello Linux`},
 {t:"text",c:"<b>Step-by-step:</b>"},
 {t:"viva",c:["open() – data.txt create/open karto; O_TRUNC junaa content clear karto.","write() – “Hello Linux” + newline file madhe lihito.","close() – file descriptor band karto.","open() – same file read-only ughadto.","read() – bytes array <code>text</code> madhe vachto.","text[n]='\\0' – string terminator; printf() display karto.","File descriptor = open() ne return kelela lahan integer jo opened file identify karto."]}
]});

P.push({id:"p9",num:9,title:"First Fit, Best Fit and Worst Fit",aim:"Implement and compare three contiguous memory allocation strategies.",blocks:[
 {t:"code",file:"p9.c",c:String.raw`#include <stdio.h>
 
int main()
{
    int block[5] = {100, 500, 200, 300, 600};
    int process[4] = {212, 417, 112, 426};
    int b[5], i, j, best;
 
    // FIRST FIT
    for (i = 0; i < 5; i++)
        b[i] = block[i];
 
    printf("First Fit:\n");
 
    for (i = 0; i < 4; i++)
    {
        for (j = 0; j < 5; j++)
        {
            if (b[j] >= process[i])
            {
                printf("%d -> Block %d\n", process[i], j + 1);
                b[j] -= process[i];
                break;
            }
        }
 
        if (j == 5)
            printf("%d -> Not allocated\n", process[i]);
    }
 
    // BEST FIT
    for (i = 0; i < 5; i++)
        b[i] = block[i];
 
    printf("\nBest Fit:\n");
 
    for (i = 0; i < 4; i++)
    {
        best = -1;
 
        for (j = 0; j < 5; j++)
        {
            if (b[j] >= process[i])
            {
                if (best == -1 || b[j] < b[best])
                    best = j;
            }
        }
 
        if (best != -1)
        {
            printf("%d -> Block %d\n", process[i], best + 1);
            b[best] -= process[i];
        }
        else
            printf("%d -> Not allocated\n", process[i]);
    }
 
    // WORST FIT
    for (i = 0; i < 5; i++)
        b[i] = block[i];
 
    printf("\nWorst Fit:\n");
 
    for (i = 0; i < 4; i++)
    {
        best = -1;
 
        for (j = 0; j < 5; j++)
        {
            if (b[j] >= process[i])
            {
                if (best == -1 || b[j] > b[best])
                    best = j;
            }
        }
 
        if (best != -1)
        {
            printf("%d -> Block %d\n", process[i], best + 1);
            b[best] -= process[i];
        }
        else
            printf("%d -> Not allocated\n", process[i]);
    }
 
    return 0;
}`},
 {t:"cmd",label:"Compile & run",c:String.raw`gcc p9.c -o p9
./p9`},
 {t:"text",c:"<b>Input (program madhech initialized):</b><br>Memory blocks: 100, 500, 200, 300, 600<br>Processes: 212, 417, 112, 426"},
 {t:"out",label:"Output",c:String.raw`First Fit:
212 -> Block 2
417 -> Block 5
112 -> Block 2
426 -> Not allocated
 
Best Fit:
212 -> Block 4
417 -> Block 2
112 -> Block 3
426 -> Block 5
 
Worst Fit:
212 -> Block 5
417 -> Block 2
112 -> Block 5
426 -> Not allocated`},

]});

P.push({id:"p10",num:10,title:"Banker’s Algorithm",aim:"Determine whether the system is in a safe state and display a safe sequence.",blocks:[

int main()
{
    int alloc[5][3] = {
        {0, 1, 0},
        {2, 0, 0},
        {3, 0, 2},
        {2, 1, 1},
        {0, 0, 2}
    };
 
    int max[5][3] = {
        {7, 5, 3},
        {3, 2, 2},
        {9, 0, 2},
        {2, 2, 2},
        {4, 3, 3}
    };
 
    int avail[3] = {3, 3, 2};
    int need[5][3], finish[5] = {0};
    int safe[5], i, j, k, count = 0, found;
 
    // Need = Max - Allocation
    for (i = 0; i < 5; i++)
        for (j = 0; j < 3; j++)
            need[i][j] = max[i][j] - alloc[i][j];
 
    // Find a safe sequence
    while (count < 5)
    {
        found = 0;
 
        for (i = 0; i < 5; i++)
        {
            if (finish[i] == 0)
            {
                for (j = 0; j < 3; j++)
                    if (need[i][j] > avail[j])
                        break;
 
                if (j == 3)
                {
                    for (k = 0; k < 3; k++)
                        avail[k] += alloc[i][k];
 
                    safe[count] = i;
                    count++;
                    finish[i] = 1;
                    found = 1;
                }
            }
        }
 
        if (found == 0)
            break;
    }
 
    if (count == 5)
    {
        printf("System is in SAFE state\n");
        printf("Safe Sequence: ");
 
        for (i = 0; i < 5; i++)
            printf("P%d ", safe[i]);
 
        printf("\n");
    }
    else
        printf("System is NOT in safe state\n");
 
    return 0;
}`},

./p10`},

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const toast = document.getElementById("toast");
function copy(text, btn, label){
  const done=()=>{ if(btn){const o=btn.textContent;btn.textContent="Copied ✔";btn.classList.add("ok");setTimeout(()=>{btn.textContent=o;btn.classList.remove("ok")},1400);}
    toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),1100); };
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(done).catch(()=>fallback())}
  else fallback();
  function fallback(){const t=document.createElement("textarea");t.value=text;t.style.position="fixed";t.style.opacity=0;document.body.appendChild(t);t.select();try{document.execCommand("copy")}catch(e){}t.remove();done();}
}

function hlC(line){
  let h=esc(line);
  if(/^\s*#include/.test(line)) return h.replace(/(#include)(.*)/,'<span class="pp">$1</span><span class="s">$2</span>');
  const ci=h.indexOf("//"); let cm="";
  if(ci>-1){cm='<span class="c2">'+h.slice(ci)+'</span>';h=h.slice(0,ci);}
  h=h.replace(/("(?:[^"\\]|\\.)*")/g,'\u0001$1\u0002').replace(/\b(int|char|return|for|while|if|else|break|void)\b/g,'<span class="k">$1</span>')
     .replace(/\b(\d+)\b/g,'<span class="n">$1</span>').replace(/\u0001("(?:[^"\\]|\\.)*")\u0002/g,'<span class="s">$1</span>')
     .replace(/\u0001|\u0002/g,"");
  return h+cm;
}

function termBlock(kind,title,content,extra){
  const wrap=document.createElement("div");
  wrap.className="term "+kind;
  const bar=document.createElement("div");bar.className="term-bar";
  bar.innerHTML='<div class="dots"><span></span><span></span><span></span></div><div class="term-title"></div><div class="btns"></div>';
  bar.querySelector(".term-title").textContent=title;
  const btns=bar.querySelector(".btns");
  const mk=(txt,fn,cls)=>{const b=document.createElement("button");b.className="btn "+(cls||"");b.textContent=txt;b.onclick=()=>copy(fn(),b);btns.appendChild(b);};
  const raw=content;
  if(kind==="cmd"){
    mk("Copy",()=>raw.split("\n").filter(l=>!/^\s*#/.test(l)||true).map(l=>l.trim()===""?"":l).join("\n"));
    mk("Copy (no comments)",()=>raw.split("\n").filter(l=>!/^\s*#/.test(l)).join("\n").replace(/\n{2,}/g,"\n"),"alt");
  } else if(kind==="cpp"){
    mk("Copy code",()=>raw);
    mk("One-shot paste",()=>"cat > "+extra+" << 'EOF'\n"+raw+"\nEOF","alt");
  } else mk("Copy",()=>raw);
  const pre=document.createElement("pre");
  pre.innerHTML=raw.split("\n").map(l=>{
    const blank=l.trim()==="";
    if(kind==="cmd"){const cm=/^\s*#/.test(l);return '<span class="line'+(cm?' cm':'')+(blank?' blank':'')+'">'+esc(l)+'</span>';}
    if(kind==="cpp") return '<span class="line">'+hlC(l)+'</span>';
    return '<span class="line">'+esc(l)+'</span>';
  }).join("");
  wrap.appendChild(bar);wrap.appendChild(pre);return wrap;
}
